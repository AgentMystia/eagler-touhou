name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: launcher/web/requirements-ci.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install --requirement launcher/web/requirements-ci.txt
      - run: node launcher/web/scripts/check.mjs
      - run: npm run typecheck --workspace @eagler/web
      - run: npm run typecheck:tools --workspace @eagler/web
      - run: npm run test:services
      - run: node --test tools/tests/runtime-package.test.mjs
      - run: npm run format:check

  ui:
    strategy:
      fail-fast: false
      matrix:
        group: [unit, artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ui:${{ matrix.group }} --workspace @eagler/web

  common:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init eagler-common
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
      - run: cmake -S eagler-common -B .cache/build/common -DEAGLER_COMMON_BUILD_TESTS=ON
      - run: cmake --build .cache/build/common --config Release --parallel 4
      - run: ctest --test-dir .cache/build/common -C Release --output-on-failure
